# C++ OpenVDB for the Rust vs C++ benchmarks (benches/compare.sh), from Anders Langlands'
# ASWF channel (https://github.com/anderslanglands/aswf-pixi).
#
#   pixi run bench-compare [filter] [--reps N] [--threads N]
[workspace]
name = "vdb-bench"
channels = ["https://conda.anaconda.org/anderslanglands", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
openvdb = "13.1.*"
cxx-compiler = "*"
python = "3.13.*"

[activation.env]
CXXFLAGS = "-O3 -DNDEBUG"

[tasks]
bench-compare = "benches/compare.sh"
